name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate `pnpm verify` runs locally: format:check, typecheck, lint,
      # test. Kept as one step on purpose — if CI and local ever drift, the
      # command developers actually run stops being the one that matters.
      # (`typecheck` and `test` each build @rit/shared first, since the apps
      # resolve it through its emitted .d.ts files.)
      - run: pnpm verify

      - run: pnpm build
